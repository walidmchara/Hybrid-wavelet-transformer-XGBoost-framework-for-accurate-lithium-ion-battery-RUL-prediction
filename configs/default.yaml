seed: 42
lookback: 32

wavelet:
  name: db4
  level: 4

transformer:
  learning_rate: 0.0005
  dropout: 0.2
  d_model: 128
  nhead: 4
  dim_feedforward: 256
  encoder_layers: 4
  decoder_layers: 2
  batch_size: 32
  epochs: 100
  patience: 15

xgboost:
  subsample: 0.8
  learning_rate: 0.05
  max_depth: 5
  n_estimators: 200

cbo:
  enabled: false
  population_size: 30
  max_iterations: 100
  omega: 0.9
  acceleration: 1.0
  mu: 0.7
  lambda_chaos: 0.10
  candidate_epochs: 15
